; ===========================================
; supervisord 配置：管理 FastAPI + Streamlit 两个进程
; ===========================================

[supervisord]
nodaemon=true                  ; 前台运行（容器要求）
user=root
logfile=/dev/null              ; 主日志走标准输出
logfile_maxbytes=0
loglevel=info

; ===========================================
; FastAPI 后端（容器内部 8000 端口）
; ===========================================
[program:fastapi]
command=uvicorn api.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=10                    ; 优先级高，先启动
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ===========================================
; Streamlit 前端（对外 7860 端口）
; ===========================================
[program:streamlit]
command=streamlit run frontend/app.py --server.port 7860 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
priority=20                    ; 后启动（依赖 FastAPI 先起来）
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0